name: Bug report
description: Report a reproducible problem in ai-translate.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new report.

  - type: input
    id: version
    attributes:
      label: Version
      description: Which package version or commit are you using?
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Include your Node.js and package-manager versions.
      placeholder: "Node 22.23.1, pnpm 10.32.1"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest configuration, command, or repository that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or stack traces. Remove secrets first.
    validations:
      required: true

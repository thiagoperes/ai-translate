name: Release

on:
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"
  # A release that fails for a reason outside the tree — a missing or expired
  # credential, a registry outage, a dropped webhook — was otherwise only
  # retryable by pushing an empty change to a package.json. Publishing is
  # idempotent, because `changeset publish` skips versions the registry already
  # has, so re-running by hand is safe.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Publishing only. Version changes and their pull requests are prepared
# locally on branches and reviewed before they reach main. This workflow has
# no pull-request permission and cannot create or update a pull request.
#
# Code quality (lint, typecheck, tests, coverage) is owned by the "CI"
# workflow, which already runs on every pull request, merge group, and push to
# main — duplicating it here doubled CI time on every push for no extra safety.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Without a credential, `changeset publish` still installs, builds, and
      # packs every package before dying in a per-package ENEEDAUTH dump that
      # buries the one fact that matters. Checking first turns a slow, unclear
      # failure into an immediate, actionable one.
      - name: Require a publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::No NPM_TOKEN secret is set, so nothing can be published."
            echo "Create a granular access token on npmjs.com with write access to the"
            echo "@ai-translate scope, then add it as the NPM_TOKEN repository secret:"
            echo "  gh secret set NPM_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          # Signed provenance needs a recent npm. Node 24.15.0 ships npm 11.12.1
          # and is part of this repository's supported engines.
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm -r --filter './packages/*' test:pack
      # `changeset publish` publishes whatever version is in the tree, and a
      # package that has never been released still carries the placeholder
      # 0.0.0. Without this guard the first push to main after adding an npm
      # token would publish 0.0.0 for every package.
      - id: guard
        name: Refuse to publish placeholder versions
        run: |
          node -e '
          const fs = require("node:fs");
          const placeholder = fs
            .readdirSync("packages")
            .filter((dir) => fs.existsSync("packages/" + dir + "/package.json"))
            .filter((dir) => JSON.parse(fs.readFileSync("packages/" + dir + "/package.json", "utf8")).version === "0.0.0");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=" + (placeholder.length === 0) + "\n");
          if (placeholder.length > 0) {
            console.log("Skipping publish. Still at 0.0.0: " + placeholder.join(", ") + ". Run pnpm release:version first.");
          }
          '
      # The token authenticates; `id-token: write` plus NPM_CONFIG_PROVENANCE is
      # what attaches a signed provenance attestation to each published version.
      # They are separate mechanisms, and both are wanted here.
      - if: steps.guard.outputs.publish == 'true'
        run: pnpm release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # @ai-translate/provider-openai is excluded from this leg: openai@7
          # requires Node >=22, so that package no longer claims Node 20 and
          # testing it here would assert support it does not offer. The other
          # six still declare engines >=20.19.0, and this leg is what backs
          # that claim.
          - node-version: 20.19.0
            filter: "--filter './packages/*' --filter '!@ai-translate/provider-openai'"
          - node-version: 22.23.1
            filter: "--filter './packages/*'"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r ${{ matrix.filter }} lint
      - run: pnpm -r ${{ matrix.filter }} typecheck
      # Coverage executes the complete Vitest suite, so running `test` first on
      # Node 22 only repeats every package test. Keep the plain test run for the
      # Node 20 compatibility leg and use coverage as the Node 22 test run.
      - if: matrix.node-version == '20.19.0'
        run: pnpm -r ${{ matrix.filter }} test
      # tsdown declares engines node "^22.18.0 || >=24.11.0", so it has never
      # supported the 20.19.0 leg of this matrix. Building twice proved nothing
      # anyway: tsdown emits a node20 target regardless of the Node that runs it.
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' build
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' coverage
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' test:pack
      # State-store efficiency is not observable from unit tests: string pooling
      # and scoped loading return identical values whether or not they work, so
      # only a measured baseline catches a silent regression.
      - if: matrix.node-version == '22.23.1'
        name: State Store Efficiency Regression Check
        run: node --expose-gc ./bench/state.bench.mjs --scale 0.25 --baseline ./bench/baseline.json

  changeset:
    name: Release Notes Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure local main branch
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git fetch origin main:main
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22.23.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status

  workflow-lint:
    name: GitHub Actions Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/actionlint@v1.7.12

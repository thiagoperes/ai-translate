name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # The lower bound this repository publishes. @ai-translate/provider-
          # openai sits above it, because openai@7 requires Node >=22, so the
          # set of packages exercised here is derived from each package's own
          # engines.node rather than hardcoded — see the filter step below.
          - 20.19.0
          - 22.23.1
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      # A hardcoded package list drifts: a package that later needs a newer
      # Node either breaks this leg or silently widens what it appears to
      # prove. Deriving the list from engines.node ties the leg to the claim
      # it is meant to back.
      - id: scope
        name: Select packages claiming Node ${{ matrix.node-version }}
        run: |
          {
            echo "filter=$(node scripts/packages-supporting-node.mjs '${{ matrix.node-version }}')"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm -r ${{ steps.scope.outputs.filter }} lint
      - run: pnpm -r ${{ steps.scope.outputs.filter }} typecheck
      # Coverage executes the complete Vitest suite, so running `test` first on
      # Node 22 only repeats every package test. Keep the plain test run for the
      # Node 20 compatibility leg and use coverage as the Node 22 test run.
      - if: matrix.node-version == '20.19.0'
        run: pnpm -r ${{ steps.scope.outputs.filter }} test
      # tsdown declares engines node "^22.18.0 || >=24.11.0", so it has never
      # supported the 20.19.0 leg of this matrix. Building twice proved nothing
      # anyway: tsdown emits a node20 target regardless of the Node that runs it.
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' build
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' coverage
      # The repo-wide coverage floor is deliberately low enough to accommodate
      # thin adapter packages. Modules where a missed branch is a correctness
      # risk rather than a style question opt into a higher bar, and that bar is
      # worth nothing if it only ever runs on someone's laptop.
      - if: matrix.node-version == '22.23.1'
        run: pnpm coverage:strict
      - if: matrix.node-version == '22.23.1'
        run: pnpm -r --filter './packages/*' test:pack
      # State-store efficiency is not observable from unit tests: string pooling
      # and scoped loading return identical values whether or not they work, so
      # only a measured baseline catches a silent regression.
      - if: matrix.node-version == '22.23.1'
        name: State Store Efficiency Regression Check
        run: node --expose-gc ./bench/state.bench.mjs --scale 0.25 --baseline ./bench/baseline.json

  changeset:
    name: Release Notes Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure local main branch
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git fetch origin main:main
          fi
      # `changeset version` consumes every changeset and writes the changelogs in
      # one commit, so on a release branch `changeset status` sees changed
      # packages with no changesets left and fails by construction. A generated
      # CHANGELOG.md is the one thing only `changeset version` produces, which
      # separates a release branch from a feature branch that forgot its notes.
      - id: kind
        name: Detect a release branch
        run: |
          if git diff --name-only main...HEAD | grep -qE '^packages/[^/]+/CHANGELOG\.md$'; then
            echo "Release branch: changelogs are generated, so the changesets are already spent."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.kind.outputs.release != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - if: steps.kind.outputs.release != 'true'
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22.23.1
      - if: steps.kind.outputs.release != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.kind.outputs.release != 'true'
        run: pnpm exec changeset status

  workflow-lint:
    name: GitHub Actions Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/actionlint@v1.7.12
